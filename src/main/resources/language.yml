config-version: 1

GLOBAL:
  NO_PERMISSION: "&#ff0000You don't have permission to execute this command."
  ONLY_PLAYERS: "&#ff0000This command can only be executed by a player."

COMMANDS:
  TRANSACTIONS:
    USAGE:
      - "&#c084fc&m                                   "
      - ""
      - "&#c084fc&l  Transactions Help"
      - ""
      - "&#a78bfa  /transactions &#f0e8ff- Open the transactions menu"
      - "&#a78bfa  /transactions <player> &#f0e8ff- View another player's transactions"
      - "&#a78bfa  /transactions top [sent|received] &#f0e8ff- View top rankings"
      - "&#a78bfa  /transactions search <name> &#f0e8ff- Search transactions"
      - ""
      - "&#c084fc&m                                   "
    RELOAD_SUCCESS: "&#10b981Configuration reloaded successfully."
    PLAYER_NOT_FOUND: "&#ff0000Player not found: {player}"
    SEARCH_USAGE: "&#ff0000Usage: /transactions search <name>"
    TOP_USAGE: "&#ff0000Usage: /transactions top [sent|received]"
